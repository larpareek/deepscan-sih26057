# SEASCAN (SIH26057) CI: lint and test the Python backend, build the React frontend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-python:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9
      - run: ruff check .

  test-python:
    name: Tests (preprocessing + geotagging)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Core algorithms only need NumPy + OpenCV; no PyTorch download in CI
      - run: pip install numpy==2.5.3 opencv-python-headless==5.0.0.93 pytest==9.1.1
      - run: pytest -q

  build-frontend:
    name: Build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
